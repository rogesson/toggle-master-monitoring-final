name: targeting-service
on:
  pull_request:
    paths: ['targeting-service/**', '.github/workflows/targeting-service.yml', '.github/workflows/service-ci.yml']
  push:
    branches: [main]
    paths: ['targeting-service/**', '.github/workflows/targeting-service.yml', '.github/workflows/service-ci.yml']

permissions:
  contents: write
  id-token: write
  security-events: write

jobs:
  ci:
    uses: ./.github/workflows/service-ci.yml
    with: { service: targeting-service, language: python }
    secrets: inherit
