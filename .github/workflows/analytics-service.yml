name: analytics-service
on:
  pull_request:
    paths: ['analytics-service/**', '.github/workflows/analytics-service.yml', '.github/workflows/service-ci.yml']
  push:
    branches: [main]
    paths: ['analytics-service/**', '.github/workflows/analytics-service.yml', '.github/workflows/service-ci.yml']

permissions:
  contents: write
  id-token: write
  security-events: write

jobs:
  ci:
    uses: ./.github/workflows/service-ci.yml
    with: { service: analytics-service, language: python }
    secrets: inherit
