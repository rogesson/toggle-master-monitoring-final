name: auth-service
on:
  pull_request:
    paths: ['auth-service/**', '.github/workflows/auth-service.yml', '.github/workflows/service-ci.yml']
  push:
    branches: [main]
    paths: ['auth-service/**', '.github/workflows/auth-service.yml', '.github/workflows/service-ci.yml']

permissions:
  contents: write
  id-token: write
  security-events: write

jobs:
  ci:
    uses: ./.github/workflows/service-ci.yml
    with: { service: auth-service, language: go }
    secrets: inherit
