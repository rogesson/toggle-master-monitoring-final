name: flag-service
on:
  pull_request:
    paths: ['flag-service/**', '.github/workflows/flag-service.yml', '.github/workflows/service-ci.yml']
  push:
    branches: [main]
    paths: ['flag-service/**', '.github/workflows/flag-service.yml', '.github/workflows/service-ci.yml']

permissions:
  contents: write
  id-token: write
  security-events: write

jobs:
  ci:
    uses: ./.github/workflows/service-ci.yml
    with: { service: flag-service, language: python }
    secrets: inherit
