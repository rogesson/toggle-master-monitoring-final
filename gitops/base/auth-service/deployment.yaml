apiVersion: apps/v1
kind: Deployment
metadata: { name: auth-service }
spec:
  replicas: 1
  selector: { matchLabels: { app: auth-service } }
  template:
    metadata: { labels: { app: auth-service } }
    spec:
      containers:
        - name: auth-service
          image: 649189683519.dkr.ecr.us-east-1.amazonaws.com/auth-service:c2d43be8df36ae737f7fa0c228bf02de0b14c5d0
          ports: [{ containerPort: 8001 }]
          env:
            - { name: PORT, value: "8001" }
            - { name: OTEL_SERVICE_NAME, value: auth-service }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: otel-collector.monitoring.svc.cluster.local:4317 }
            - { name: OTEL_ENVIRONMENT, value: staging }
            - { name: DATABASE_URL, valueFrom: { secretKeyRef: { name: toggle-master-secrets, key: AUTH_DB_URL } } }
            - { name: MASTER_KEY, valueFrom: { secretKeyRef: { name: toggle-master-secrets, key: MASTER_KEY } } }
          readinessProbe: { httpGet: { path: /health, port: 8001 } }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata: { name: auth-service }
spec:
  selector: { app: auth-service }
  ports: [{ port: 8001, targetPort: 8001 }]
