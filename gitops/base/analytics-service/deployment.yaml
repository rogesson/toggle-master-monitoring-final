apiVersion: apps/v1
kind: Deployment
metadata: { name: analytics-service }
spec:
  replicas: 1
  selector: { matchLabels: { app: analytics-service } }
  template:
    metadata: { labels: { app: analytics-service } }
    spec:
      containers:
        - name: analytics-service
          image: 649189683519.dkr.ecr.us-east-1.amazonaws.com/analytics-service:8da5a9b7bf394cfb7fff0a19660a808149906f60
          ports: [{ containerPort: 8005 }]
          env:
            - { name: PORT, value: "8005" }
            - { name: OTEL_SERVICE_NAME, value: analytics-service }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: http://otel-collector.monitoring.svc.cluster.local:4318 }
            - { name: OTEL_EXPORTER_OTLP_PROTOCOL, value: http/protobuf }
            - { name: OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED, value: "true" }
            - { name: OTEL_RESOURCE_ATTRIBUTES, value: deployment.environment.name=staging }
            - { name: AWS_REGION, valueFrom: { configMapKeyRef: { name: toggle-master-config, key: AWS_REGION } } }
            - { name: AWS_SQS_URL, valueFrom: { secretKeyRef: { name: toggle-master-secrets, key: AWS_SQS_URL } } }
            - { name: AWS_DYNAMODB_TABLE, valueFrom: { configMapKeyRef: { name: toggle-master-config, key: AWS_DYNAMODB_TABLE } } }
          readinessProbe: { httpGet: { path: /health, port: 8005 } }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata: { name: analytics-service }
spec:
  selector: { app: analytics-service }
  ports: [{ port: 8005, targetPort: 8005 }]
