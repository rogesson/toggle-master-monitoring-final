apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: telemetry-secrets-store
  namespace: monitoring
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: telemetry-secrets
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: telemetry-secrets-store
    kind: SecretStore
  target:
    name: telemetry-secrets
    creationPolicy: Owner
  data:
    - secretKey: NEW_RELIC_LICENSE_KEY
      remoteRef:
        key: toggle-master/staging/observability
        property: NEW_RELIC_LICENSE_KEY
    - secretKey: PAGERDUTY_ROUTING_KEY
      remoteRef:
        key: toggle-master/staging/observability
        property: PAGERDUTY_ROUTING_KEY
    - secretKey: DISCORD_WEBHOOK_URL
      remoteRef:
        key: toggle-master/staging/observability
        property: DISCORD_WEBHOOK_URL
    - secretKey: SELF_HEALING_WEBHOOK_TOKEN
      remoteRef:
        key: toggle-master/staging/observability
        property: SELF_HEALING_WEBHOOK_TOKEN
