apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-gateway-config
  namespace: monitoring
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    receivers:
      otlp:
        protocols:
          grpc: { endpoint: 0.0.0.0:4317 }
          http: { endpoint: 0.0.0.0:4318 }
    processors:
      memory_limiter: { check_interval: 1s, limit_mib: 400, spike_limit_mib: 100 }
      k8sattributes:
        auth_type: serviceAccount
        extract:
          metadata: [k8s.namespace.name, k8s.pod.name, k8s.container.name]
      batch: {}
    exporters:
      prometheus:
        endpoint: 0.0.0.0:9464
        resource_to_telemetry_conversion: { enabled: true }
      otlphttp/loki:
        endpoint: http://loki-gateway.monitoring.svc.cluster.local/otlp
      otlphttp/newrelic:
        endpoint: ${env:NEW_RELIC_OTLP_ENDPOINT}
        headers:
          api-key: ${env:NEW_RELIC_LICENSE_KEY}
    service:
      extensions: [health_check]
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [prometheus, otlphttp/newrelic]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [otlphttp/newrelic]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [otlphttp/loki, otlphttp/newrelic]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-agent-config
  namespace: monitoring
data:
  config.yaml: |
    receivers:
      filelog:
        include: [/var/log/pods/*/*/*.log]
        start_at: end
        include_file_path: true
        operators:
          - type: container
          - type: regex_parser
            id: parse_pod_metadata_from_path
            parse_from: attributes["log.file.path"]
            regex: '^/var/log/pods/(?P<k8s_namespace_name>[^_]+)_(?P<k8s_pod_name>[^_]+)_(?P<k8s_pod_uid>[a-f0-9-]+)/(?P<k8s_container_name>[^/]+)/(?P<restart_count>\d+)\.log$'
          - type: move
            from: attributes.k8s_namespace_name
            to: resource["k8s.namespace.name"]
          - type: move
            from: attributes.k8s_pod_name
            to: resource["k8s.pod.name"]
          - type: move
            from: attributes.k8s_container_name
            to: resource["k8s.container.name"]
    processors:
      memory_limiter: { check_interval: 1s, limit_mib: 200, spike_limit_mib: 50 }
      k8sattributes:
        auth_type: serviceAccount
        extract:
          metadata: [k8s.namespace.name, k8s.pod.name, k8s.container.name]
      batch: {}
    exporters:
      otlphttp/gateway:
        endpoint: http://otel-collector.monitoring.svc.cluster.local:4318
    service:
      pipelines:
        logs:
          receivers: [filelog]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [otlphttp/gateway]
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: otel-collector, namespace: monitoring }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: otel-collector }
rules:
  - apiGroups: [""]
    resources: [pods, namespaces]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: otel-collector }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: otel-collector }
subjects:
  - { kind: ServiceAccount, name: otel-collector, namespace: monitoring }
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: monitoring
  labels: { app: otel-collector }
spec:
  selector: { app: otel-collector }
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
    - { name: otlp-http, port: 4318, targetPort: 4318 }
    - { name: metrics, port: 9464, targetPort: 9464 }
    - { name: health, port: 13133, targetPort: 13133 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: monitoring
spec:
  replicas: 1
  selector: { matchLabels: { app: otel-collector } }
  template:
    metadata: { labels: { app: otel-collector } }
    spec:
      serviceAccountName: otel-collector
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.120.0
          args: [--config=/conf/config.yaml]
          env:
            - name: NEW_RELIC_OTLP_ENDPOINT
              valueFrom: { configMapKeyRef: { name: telemetry-settings, key: NEW_RELIC_OTLP_ENDPOINT } }
            - name: NEW_RELIC_LICENSE_KEY
              valueFrom: { secretKeyRef: { name: telemetry-secrets, key: NEW_RELIC_LICENSE_KEY, optional: true } }
          ports:
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
            - { name: metrics, containerPort: 9464 }
            - { name: health, containerPort: 13133 }
          readinessProbe: { httpGet: { path: /, port: health } }
          livenessProbe: { httpGet: { path: /, port: health } }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - { name: config, mountPath: /conf, readOnly: true }
      volumes:
        - name: config
          configMap: { name: otel-gateway-config }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-collector-agent
  namespace: monitoring
spec:
  selector: { matchLabels: { app: otel-collector-agent } }
  template:
    metadata: { labels: { app: otel-collector-agent } }
    spec:
      serviceAccountName: otel-collector
      tolerations:
        - operator: Exists
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.120.0
          args: [--config=/conf/config.yaml]
          ports: []
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 250m, memory: 256Mi }
          volumeMounts:
            - { name: config, mountPath: /conf, readOnly: true }
            - { name: podlogs, mountPath: /var/log/pods, readOnly: true }
      volumes:
        - name: config
          configMap: { name: otel-agent-config }
        - name: podlogs
          hostPath: { path: /var/log/pods, type: Directory }
