apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: toggle-master-observability
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rogesson/toggle-master-monitoring.git
    targetRevision: main
    path: gitops/observability
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
